---
- name: Install Docker in VM
  gather_facts: true
  gather_subset:
    - '!all'
    - 'min'
  hosts: gitlab-runners
  vars:
    ansible_ssh_user: user
  become: true

  pre_tasks:
    - name: Wait for vm to become reachable
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 300

  tasks:
    - name: Add oficial APT Docker repository (DEB822 format)
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/ubuntu
        suites: "{{ ansible_distribution_release }}"
        components: stable
        architectures: amd64
        signed_by: https://download.docker.com/linux/ubuntu/gpg

    - name: Update repository and install Docker
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes

    - name: Ensure group docker exists
      ansible.builtin.group:
        name: docker
        state: present

    - name: Add current user to group docker
      ansible.builtin.user:
        name: "{{ ansible_ssh_user }}"
        groups: docker
        append: yes

    - name: Start and enable Docker
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: yes